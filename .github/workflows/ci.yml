name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Contract kit is unchanged
        run: |
          sha256sum --check --strict .github/contract.sha256
          test "$(find contract -type f | wc -l)" -eq 4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Syntax check
        run: find src tests examples -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Coding standard (PSR-12)
        run: composer lint
      - name: Tests
        run: composer test
      - name: Run both examples against a local stand-in
        run: composer smoke
